name: Week 6 commodities dashboard tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/week-06/**"
      - "scripts/export_week_06_commodities.py"
      - "tests/test_week06_commodities.py"
      - "tests/week06_commodities*"
      - ".github/workflows/test-week06-commodities.yml"
  push:
    branches: [main]
    paths:
      - "docs/week-06/**"
      - "scripts/export_week_06_commodities.py"
      - "tests/test_week06_commodities.py"
      - "tests/week06_commodities*"

permissions:
  contents: read

jobs:
  commodity-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test commodity math and Python snapshot generator
        run: |
          python -m pip install "pandas>=2.2,<3" "pandas-datareader>=0.10,<0.11" "pyarrow>=17,<30" "setuptools>=70"
          python -m pip install "openpyxl>=3.1,<4"
          python -m unittest discover -s tests -p 'test_week06_commodities.py'
          python -m unittest discover -s tests -p 'test_world_bank_pink_sheet.py'
          node --test tests/week06_commodities_model.test.cjs
      - name: Verify official World Bank, EIA and IMF commodity data
        run: |
          python scripts/export_week_06_commodities.py
          python -c "import json; s=json.load(open('docs/week-06/commodities/data.json')); assert s['status']=='ready' and s['schema_version']==2 and len(s['commodities'])>=33; print(len(s['commodities']), 'benchmarks from official sources')"
      - name: Install Chromium and Plotly
        run: |
          npm install --no-save playwright@1.55.1 plotly.js-dist-min@2.32.0
          npx playwright install --with-deps chromium
      - name: Exercise three-asset dashboard in real Chromium
        run: |
          node tests/week06_commodities_browser.test.cjs
          node tests/week06_commodities_catalog_browser.test.cjs
      - name: Attach screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week06-commodities
          path: test-artifacts/
          if-no-files-found: ignore
