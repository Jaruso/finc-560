name: Refresh macro dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "23 14 * * *"
  push:
    branches:
      - main
    paths:
      - "src/assignments/week_05.py"
      - "src/data/**"
      - "scripts/export_plotly.py"
      - "requirements.txt"
      - ".github/workflows/refresh-macro-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: refresh-macro-dashboard
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore macro data cache
        uses: actions/cache@v5
        with:
          path: data/raw
          key: macro-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            macro-data-${{ runner.os }}-

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Regenerate Week 5 from current APIs
        env:
          MACRO_FORCE_REFRESH: "1"
          WORLD_BANK_RETRY_ATTEMPTS: "4"
          WORLD_BANK_RETRY_DELAY_SECONDS: "2"
        run: python scripts/export_plotly.py --assignment week-05

      - name: Commit refreshed dashboard assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/plots-manifest.json docs/visualizations/week-05/
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh Week 5 macro dashboard data"
          git push
