name: Refresh Week 6 Treasury scenario data

on:
  workflow_dispatch:
  schedule:
    - cron: "47 13 * * 1-5"
  push:
    branches:
      - main
      - feature/week-06-treasury-simulator
    paths:
      - "src/assignments/week_06.py"
      - "scripts/export_week_06.py"
      - "docs/week-06/**"
      - "tests/**"
      - ".github/workflows/refresh-week-06.yml"

permissions:
  contents: write

concurrency:
  group: refresh-week-06-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Test scenario model
        run: node --test tests/week_06_model.test.cjs
      - name: Test Python snapshot builder
        run: python -m unittest discover -s tests -p 'test_week_06.py'
      - name: Generate real historical FRED snapshot
        env:
          MACRO_FORCE_REFRESH: "1"
        run: python scripts/export_week_06.py
      - name: Commit refreshed data only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/week-06/data.json
          if git diff --cached --quiet; then
            echo "No new FRED snapshot."
            exit 0
          fi
          git commit -m "data: refresh Week 6 FRED Treasury observations"
          git push
