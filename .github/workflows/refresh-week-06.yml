name: Refresh Week 6 Treasury scenario data

on:
  workflow_dispatch:
  schedule:
    - cron: "47 13 * * 1-5"
  push:
    branches:
      - main
      - feature/week06-live-diebold-li
    paths:
      - "src/assignments/week_06.py"
      - "scripts/export_week_06.py"
      - "docs/week-06/**"
      - "!docs/week-06/commodities/**"
      - "!docs/week-06/companies/**"
      - "tests/**"
      - ".github/workflows/refresh-week-06.yml"

permissions:
  contents: write

concurrency:
  group: refresh-week-06-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Test scenario model
        run: node --test tests/week_06_model.test.cjs tests/week06_forecast_frontend.test.cjs
      - name: Test Python snapshot builder
        run: |
          python -m unittest discover -s tests -p 'test_week_06.py'
          python -m unittest discover -s tests -p 'test_week_06_forecast.py'
      - name: Generate real historical FRED snapshot
        env:
          MACRO_FORCE_REFRESH: "1"
        run: python scripts/export_week_06.py
      - name: Verify complete fitted model snapshot
        run: python -c "import json; d=json.load(open('docs/week-06/data.json')); assert d['schema_version']==2 and len(d['forecast'])==25 and len(d['backtest']['metrics'])==9"
      - name: Commit refreshed data only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/week-06/data.json
          if git diff --cached --quiet; then
            echo "No new FRED snapshot."
            exit 0
          fi
          git commit -m "data: refresh Week 6 FRED Treasury observations"
          # Another data refresher or an agent may have committed meanwhile.
          # GitHub Actions refreshes (and human commits) may push in parallel.
          # The remote can move between pull and push: retry non-fast-forward
          # errors rather than failing after a single successful fetch.
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Refreshed data published on attempt ${attempt}."
              exit 0
            fi
            echo "Concurrent push on attempt ${attempt}; retrying..."
            sleep $((attempt * 2))
          done
          echo "Unable to publish after six attempts." >&2
          exit 1
