name: Week 6 company dashboard browser checks

# This optional Chromium regression suite is expensive and currently nonblocking.
# Run it explicitly from GitHub Actions when the dashboard needs full UI QA.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify SEC normalization and browser models
        run: |
          python -m unittest discover -s tests -p 'test_week_06_companies.py'
          python -m unittest discover -s tests -p 'test_week06_featured_snapshots.py'
          node --test tests/week06_companies_model.test.cjs tests/research_model.test.cjs
      - name: Install isolated browser test tools
        run: |
          npm install --no-save playwright@1.55.1 plotly.js-dist-min@2.32.0
          npx playwright install --with-deps chromium
      - name: Exercise both Week 6 dashboards
        run: node tests/week06_companies_browser.test.cjs
      - name: Attach screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week06-company-views
          path: test-artifacts/
          if-no-files-found: ignore
