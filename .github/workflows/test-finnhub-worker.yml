name: Test Finnhub Worker
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/test-finnhub-worker.yml'
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/test-finnhub-worker.yml'

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Worker tests
        run: npm test
