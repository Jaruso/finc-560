name: Refresh featured company financials

on:
  workflow_dispatch:
  schedule:
    - cron: "29 15 * * 1-5"
  push:
    branches:
      - feature/week06-corporate-forecasting
    paths:
      - "scripts/export_week_06_companies.py"
      - "tests/test_week_06_companies.py"
      - ".github/workflows/refresh-week06-companies.yml"

permissions:
  contents: write

concurrency:
  group: featured-company-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test SEC normalization
        run: python -m unittest discover -s tests -p 'test_week_06_companies.py'
      - name: Retrieve actual SEC Company Facts
        run: python scripts/export_week_06_companies.py
      - name: Validate complete dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path("docs/week-06/companies/data")
          manifest = json.loads((folder / "manifest.json").read_text())
          assert manifest["status"] == "ready" and len(manifest["companies"]) == 4
          for company in manifest["companies"]:
              payload = json.loads((folder / (company["ticker"] + ".json")).read_text())
              assert payload["status"] == "ready" and len(payload["annual"]) >= 5
              assert payload["annual"][-1]["fiscal_end"] == company["latest_fiscal_end"]
              print(company["ticker"], len(payload["annual"]), company["latest_fiscal_end"])
          PY
      - name: Commit verified snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/week-06/companies/data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: update featured company financial statements"
          git push
