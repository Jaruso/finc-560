<script>
(function () {
  const graph = document.querySelector(".plotly-graph-div");
  if (!graph || !window.Plotly) return;

  let pending = false;
  function resizePlot() {
    if (pending) return;
    pending = true;
    window.requestAnimationFrame(() => {
      pending = false;
      Plotly.Plots.resize(graph);
    });
  }

  window.addEventListener("resize", resizePlot);
})();
